services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: launa
      POSTGRES_PASSWORD: launa
      POSTGRES_DB: launa
    ports:
      - "5432:5432"
    volumes:
      - launa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launa"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # config.json (đã chứa connectionString) được copy vào image lúc build.
    # Khi chạy compose, mount config.json riêng để override:
    volumes:
      - ./config.json:/app/config.json:ro
    ports:
      - "5000:5000"

volumes:
  launa_pg:
